[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-interviewer-workflow"
description = "Provider-neutral resume preparation and stateful mock interview workflow"
readme = "README.md"
keywords = ["interview", "llm", "workflow", "fastapi"]
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.162,<1", "starlette>=1.9,<2", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3", "python-multipart>=0.0.18", "jinja2>=3.1,<4", "pypdf>=6.21.2,<7", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.15"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
