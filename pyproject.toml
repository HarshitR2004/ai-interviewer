[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-interviewer-workflow"
description = "Provider-neutral resume preparation and stateful mock interview workflow"
readme = "README.md"
keywords = ["interview", "llm", "workflow", "fastapi"]
version = "3.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.162,<1", "starlette>=1.9,<2", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3", "python-multipart>=0.0.18", "pypdf>=6.21.2,<7", "httpx>=0.27,<1", "livekit-api==1.2.2"]

[project.optional-dependencies]
voice = ["google-genai==2.33.0", "livekit-agents==1.8.9", "numpy>=2,<3"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.15", "mypy>=1.15", "build>=1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
include = ["backend*"]
namespaces = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend"]
